name: Eval

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/**'
      - 'src/app/api/**'
      - 'evals/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eval.yml'
  pull_request:
    paths:
      - 'src/lib/**'
      - 'src/app/api/**'
      - 'evals/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eval.yml'
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          EVAL_PASS_THRESHOLD: '0.8'
        run: pnpm eval

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results/
          retention-days: 30

      - name: Publish to evals-site
        if: ${{ success() && github.event_name != 'pull_request' }}
        env:
          EVALS_SITE_TOKEN: ${{ secrets.EVALS_SITE_TOKEN }}
        run: |
          if [ -z "$EVALS_SITE_TOKEN" ]; then
            echo "EVALS_SITE_TOKEN secret not configured; skipping publish."
            echo "Create a fine-grained PAT scoped to zeroindex-ai/evals-site"
            echo "(Contents: Read and write) and add it as EVALS_SITE_TOKEN."
            exit 0
          fi

          RESULT=$(ls -t evals/results/run-*.json 2>/dev/null | head -1)
          if [ -z "$RESULT" ]; then
            echo "No eval result file found; skipping publish."
            exit 0
          fi
          echo "Publishing $RESULT"

          git clone --depth 1 \
            "https://x-access-token:${EVALS_SITE_TOKEN}@github.com/zeroindex-ai/evals-site.git" \
            /tmp/evals-site
          cd /tmp/evals-site

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p artifacts/ask-zeroindex
          cp "$GITHUB_WORKSPACE/$RESULT" artifacts/ask-zeroindex/

          pnpm install --frozen-lockfile
          pnpm render \
            --in "artifacts/ask-zeroindex/$(basename "$RESULT")" \
            --out public/ask-zeroindex/latest.html \
            --project ask-zeroindex \
            --threshold 0.8

          git add public/ask-zeroindex/latest.html
          if git diff --staged --quiet; then
            echo "No HTML changes; nothing to publish."
            exit 0
          fi
          git commit -m "publish: ask-zeroindex eval (from run ${GITHUB_RUN_ID})"
          git push origin main
