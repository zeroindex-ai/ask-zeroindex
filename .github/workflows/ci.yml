name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Coverage threshold is 75% (see vitest.config.ts). Reported in CI as a
      # signal but not yet a hard gate — overall coverage is currently below
      # threshold because I/O-bound modules (claude/embeddings/db) and the
      # AskWidget React component are not yet directly unit-tested.
      - run: pnpm test:coverage
        continue-on-error: true

      - run: pnpm build
